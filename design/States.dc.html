<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>herdr attention states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
.shadow_sm{box-shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px -1px rgba(0,0,0,.1)}
.shadow_md{box-shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1)}
.shadow_xl{box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.cut{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</helmet>
<div style="width: 560px; height: 520px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 22px; background: #0f1012; color: #d6d8de; font-family: Inter, system-ui, sans-serif; font-size: 12px; line-height: 1.3">

  <!-- strip cards -->
  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 11px; font-weight: 600; color: #868993">Strip cards</span>
    <button class="shadow_md" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: #35222a; border: 1px solid rgba(240,112,138,0.45)">
      <span aria-hidden="true" style="flex: none; width: 28px; height: 28px; border-radius: 9px; background: #f0708a; color: #2a1018; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3.5v5.5M8 12.3v.2"/></svg></span>
      <span style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span class="cut" style="font-size: 13px; font-weight: 600; color: #f4f5f7">Ask user question tool test</span>
        <span class="cut" style="color: #c4c6cd">Claude Code · amal-build › hushtype-speech</span>
      </span>
      <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
        <span style="font-size: 11px; font-weight: 500; color: #ffb3c0">Waiting on you · &lt;1m</span>
        <span class="mono" style="font-size: 10.5px; font-weight: 500; padding: 1px 6px; border-radius: 5px; background: #f0708a; color: #2a1018">t1f</span>
      </span>
    </button>
    <button class="shadow_sm" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: #18191c; border: 1px solid rgba(255,255,255,0.07)">
      <span aria-hidden="true" style="flex: none; width: 28px; height: 28px; border-radius: 9px; background: rgba(95,211,141,0.18); color: #5fd38d; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg></span>
      <span style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span class="cut" style="font-size: 13px; font-weight: 600; color: #f4f5f7">Default CPU vs GPU model recommendation</span>
        <span class="cut" style="color: #a4a7b0">Claude Code · amal-build › termux-launcher</span>
      </span>
      <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
        <span style="font-size: 11px; font-weight: 500; color: #5fd38d">Finished · 1m</span>
        <span class="mono" style="font-size: 10.5px; padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,0.08); color: #a4a7b0">t1d</span>
      </span>
    </button>
  </div>

  <!-- capsules -->
  <div style="display: flex; gap: 16px">
    <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 11px; font-weight: 600; color: #868993">Capsule — a terminal waits</span>
      <div class="shadow_md" style="display: flex; flex-direction: column; gap: 1px; padding: 3px; border-radius: 9px; background: #2d1f25; border: 1px solid rgba(240,112,138,0.45)">
        <div style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 5px">
          <span aria-hidden="true" style="flex: none; width: 20px; height: 20px; border-radius: 6px; background: rgba(255,255,255,0.08); color: #c9ccd4; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">H</span>
          <span class="cut" style="flex: 1 1 0; font-weight: 600">hushtype-speech</span>
        </div>
        <button style="display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 7px 0 10px; box-sizing: border-box; border-radius: 6px">
          <span aria-hidden="true" style="flex: none; width: 10px; display: flex; justify-content: center"><span style="width: 8px; height: 8px; box-sizing: border-box; border-radius: 4px; border: 1.5px solid #868993"></span></span>
          <span class="cut" style="flex: 1 1 0">Issue #35</span>
          <span style="font-size: 11px; color: #a4a7b0">20m</span>
          <span class="mono" style="font-size: 10.5px; padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,0.08); color: #a4a7b0">t14</span>
        </button>
        <button style="display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 7px 0 10px; box-sizing: border-box; border-radius: 6px; background: rgba(240,112,138,0.2)">
          <span role="img" aria-label="waiting" style="flex: none; width: 10px; display: flex; justify-content: center"><span style="width: 7px; height: 7px; border-radius: 2px; background: #f0708a"></span></span>
          <span class="cut" style="flex: 1 1 0; font-weight: 500; color: #f4f5f7">Ask user question tool test</span>
          <span style="font-size: 11px; color: #ffb3c0">&lt;1m</span>
          <span class="mono" style="font-size: 10.5px; font-weight: 500; padding: 1px 6px; border-radius: 5px; background: #f0708a; color: #2a1018">t1f</span>
        </button>
      </div>
    </div>
    <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 11px; font-weight: 600; color: #868993">Capsule — an agent finished</span>
      <div class="shadow_sm" style="display: flex; flex-direction: column; gap: 1px; padding: 3px; border-radius: 9px; background: #1c2a22; border: 1px solid rgba(95,211,141,0.35)">
        <div style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 5px">
          <span aria-hidden="true" style="flex: none; width: 20px; height: 20px; border-radius: 6px; background: rgba(255,255,255,0.08); color: #c9ccd4; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">T</span>
          <span class="cut" style="flex: 1 1 0; font-weight: 600">termux-launcher</span>
        </div>
        <button style="display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 7px 0 10px; box-sizing: border-box; border-radius: 6px">
          <svg role="img" aria-label="finished" width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="#5fd38d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>
          <span class="cut" style="flex: 1 1 0">Default CPU vs GPU model recommendation</span>
          <span style="font-size: 11px; color: #a4a7b0">1m</span>
          <span class="mono" style="font-size: 10.5px; padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,0.08); color: #a4a7b0">t1d</span>
        </button>
      </div>
    </div>
  </div>

  <!-- toast -->
  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 11px; font-weight: 600; color: #868993">Toast</span>
    <div role="status" class="shadow_xl" style="width: 300px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: #26282d; border: 1px solid rgba(255,255,255,0.1)">
      <span aria-hidden="true" style="flex: none; width: 28px; height: 28px; border-radius: 9px; background: #f0708a; color: #2a1018; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3.5v5.5M8 12.3v.2"/></svg></span>
      <span style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 13px; font-weight: 600; color: #f4f5f7">Claude Code needs you</span>
        <span class="cut" style="color: #a4a7b0">hushtype-speech / Claude Code</span>
      </span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":520}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
